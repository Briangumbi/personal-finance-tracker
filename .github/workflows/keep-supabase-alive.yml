name: Keep Supabase Alive

on:
  schedule:
    # Every 3 days at 06:00 UTC — well under Supabase's 7-day pause window.
    - cron: '0 6 */3 * *'
  workflow_dispatch: # allow manual runs from the Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit health-check endpoint
        run: |
          if [ -z "${{ vars.HEALTH_CHECK_URL }}" ]; then
            echo "HEALTH_CHECK_URL repository variable is not set yet — see README for setup." >&2
            exit 1
          fi
          curl -sf "${{ vars.HEALTH_CHECK_URL }}"
